[package]
name = "ava-tray"
version = "0.1.0"
edition = "2021"

# Em release, otimiza para tamanho/velocidade e remove símbolos de debug.
[profile.release]
opt-level = 3
lto = true
strip = true
panic = "abort"

[target.'cfg(unix)'.dependencies]
nix = { version = "0.29", features = ["signal"] }

# Linux: tray-icon usa GTK/libappindicator por baixo dos panos, então
# precisamos do gtk e do glib como deps diretas para inicializar o GTK
# antes de criar o ícone e bombear eventos no loop principal.
[target.'cfg(target_os = "linux")'.dependencies]
gtk = "0.18"
glib = "0.18"

[dependencies]
# ── Runtime assíncrono (compartilhado entre API REST e watchers) ─────────────
reqwest = { version = "0.12", features = ["json"] }
tokio = { version = "1", features = ["full"] }

# ── Servidor REST ──────────────────────────────────────────────────────────
axum = "0.7"
tower = "0.4"
tower-http = { version = "0.5", features = ["trace", "cors"] }

# ── Serialização JSON ──────────────────────────────────────────────────────
serde = { version = "1", features = ["derive"] }
serde_json = "1"

# ── GUI (janela imediata, leve, multiplataforma) ───────────────────────────
eframe = { version = "0.28", default-features = false, features = [
    "default_fonts",
    "glow",
    "persistence",
] }
egui = "0.28"

# ── Ícone na bandeja do sistema (tray) ─────────────────────────────────────
tray-icon = "0.14"

# ── Loop de eventos nativo (necessário para o tray-icon funcionar) ─────────
winit = "0.29"

# ── Logging ─────────────────────────────────────────────────────────────────
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

# ── Utilitários ─────────────────────────────────────────────────────────────
anyhow = "1"
chrono = "0.4"
image = { version = "0.25", default-features = false, features = ["png"] }
