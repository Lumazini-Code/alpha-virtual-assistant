# Override Windows — publica as portas do stack no loopback do host e aponta
# os clientes do container para os serviços do HOST (tray, CDP, transcribe,
# mcp_manager). Serve para as duas rotas: Docker Desktop (WSL2) e Docker
# Engine no WSL Debian-slim (rota B — os relays socat/portproxy do
# install.ps1 completam a ponte host <-> VM).
# Uso: docker compose -f docker-compose.yml -f docker-compose.windows.yml up

services:

  # ─────────────────────────────────────────────
  # GPU via Vulkan — Windows
  # Sem suporte a PulseAudio, /dev/dri ou /dev/snd.
  # GPU Vulkan via WSL2 pode funcionar com drivers recentes da NVIDIA/AMD/Intel.
  # ─────────────────────────────────────────────
  ava:
    ports:
      # Serviços DO CONTAINER expostos ao host (TUI/process manager).
      # NUNCA publicar 9001 (tray), 9222 (Chrome CDP) nem 4008 (mcp_manager)
      # — são serviços do HOST: publicar faz o proxy do Docker Desktop
      # capturar a porta e sombrear o serviço local (TUI recebia "socket
      # closed" no tray), e na 4008 o publish colide com o bind do
      # mcp_manager nativo (roda NO HOST, supervisionado pelo tray).
      # Prefixo 127.9.12.22: em TODAS as portas — sem ele o Docker Desktop
      # publica em 0.0.0.0 e a LAN inteira alcança os serviços (Plano 1 — T9).
      - "127.9.12.22:3000:3000"
      - "127.9.12.22:4005:4005"
      - "127.9.12.22:4003:4003"
      - "127.9.12.22:3003:3003"
      - "127.9.12.22:3001:3001"
      - "127.9.12.22:2002:2002"
      - "127.9.12.22:3002:3002"
      - "127.9.12.22:3004:3004"
      - "127.9.12.22:4002:4002"
      - "127.9.12.22:9000:9000"
      - "127.9.12.22:3005:3005"
      - "127.9.12.22:2001:2001"

    # Container → serviços do host (tray :9001, Chrome CDP :9222,
    # transcribe :9100, mcp_manager :4008). No Windows/WSL2 `localhost`
    # dentro do container NÃO é o host — as URLs abaixo apontam os clientes
    # do container para os serviços no HOST via host.docker.internal (o
    # Docker Desktop ponteia pro loopback do host; na rota WSL, os relays
    # socat + portproxy do install.ps1 fazem a ponte). No Linux (host
    # network) os defaults localhost/127.9.12.22 continuam valendo.
    extra_hosts:
      - "host.docker.internal:host-gateway"

    environment:
      PULSE_SERVER: "unix:/run/user/1000/pulse/native"
      PULSE_RUNTIME_PATH: "/run/user/1000/pulse"
      PROCESS_MANAGER_URL: "http://host.docker.internal:9001"
      # mcp_manager (Rust) roda NO HOST (spawnado pelo tray) — o default do
      # orchestrator (127.9.12.22:4008) apontaria para o próprio container.
      MCP_MANAGER_URL: "http://host.docker.internal:4008"
      # Embedding on-demand (cadastro de voz): o transcribe (main.cpp) roda
      # NO HOST (microfone) — dentro do container "localhost" não é o host.
      # Mesmo tratamento do PROCESS_MANAGER_URL (extra_hosts já tem o gateway).
      TRANSCRIBE_HTTP_URL: "http://host.docker.internal:9100"

    # ── DBs da memory em volume nomeado (fs Linux da VM) ──
    # SQLite + WAL sobre o bind mount do Docker Desktop (drvfs/9p) não é
    # confiável — "unable to open database file" no graph poll. O volume
    # sombreia o subdiretório db/ dentro do bind mount de ./Modules.
    # No Linux (docker-compose.linux.yml) o bind mount nativo continua.
    volumes:
      - ava-memory:/app/Modules/memory/db
      - /mnt/wslg/runtime-dir/pulse/native:/run/user/1000/pulse/native:rw

volumes:
  ava-memory:
    driver: local
