# Override Windows — publica as portas via Docker Desktop (WSL2).
# Uso: docker compose -f docker-compose.yml -f docker-compose.windows.yml up

services:

  # ─────────────────────────────────────────────
  # GPU via Vulkan — Windows
  # Sem suporte a PulseAudio, /dev/dri ou /dev/snd.
  # GPU Vulkan via WSL2 pode funcionar com drivers recentes da NVIDIA/AMD/Intel.
  # ─────────────────────────────────────────────
  ava:
    ports:
      # Serviços DO CONTAINER expostos ao host (TUI/process manager).
      # NUNCA publicar 9001 (tray) nem 9222 (Chrome CDP) — são serviços do
      # HOST: publicar faz o proxy do Docker Desktop capturar a porta e
      # sombrear o serviço local (TUI recebia "socket closed" no tray).
      - "3000:3000"
      - "4005:4005"
      - "4003:4003"
      - "3003:3003"
      - "3001:3001"
      - "2002:2002"
      - "3002:3002"
      - "3004:3004"
      - "4002:4002"
      - "9000:9000"
      - "3005:3005"
      - "2001:2001"
      - "4008:4008"

    # Container → serviços do host (tray :9001, Chrome CDP :9222).
    # No Windows/WSL2 `localhost` dentro do container NÃO é o host —
    # o PROCESS_MANAGER_URL e o AVA_CDP_ENDPOINT abaixo apontam os
    # clientes do container pro tray/Chrome no host. No Linux (host
    # network) os defaults localhost continuam valendo.
    extra_hosts:
      - "host.docker.internal:host-gateway"

    environment:
      PULSE_SERVER: "unix:/run/user/1000/pulse/native"
      PULSE_RUNTIME_PATH: "/run/user/1000/pulse"
      PROCESS_MANAGER_URL: "http://host.docker.internal:9001"
      AVA_CDP_ENDPOINT: "http://host.docker.internal:9222"
      # Servidores MCP http cadastrados como http://localhost:PORTA pela
      # TUI no HOST — dentro do container "localhost" é o próprio container.
      # O mcp_manager reescreve localhost/127.0.0.1 → host.docker.internal
      # (porta e path preservados) no momento da conexão.
      AVA_LOCALHOST_REWRITE: "http://host.docker.internal"

    # ── DBs da memory em volume nomeado (fs Linux da VM) ──
    # SQLite + WAL sobre o bind mount do Docker Desktop (drvfs/9p) não é
    # confiável — "unable to open database file" no graph poll. O volume
    # sombreia o subdiretório db/ dentro do bind mount de ./Modules.
    # No Linux (docker-compose.linux.yml) o bind mount nativo continua.
    volumes:
      - ava-memory:/app/Modules/memory/db
      - /mnt/wslg/runtime-dir/pulse/native:/run/user/1000/pulse/native:rw

volumes:
  ava-memory:
    driver: local
