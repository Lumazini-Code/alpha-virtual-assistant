[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "boardview-mcp"
version = "0.1.0"
description = "Servidor MCP para análise de boardviews (GenCAD .cad) por IAs - reparo de placas eletrônicas"
requires-python = ">=3.10"
dependencies = ["mcp>=1.9,<2", "pillow>=10.1"]

[project.optional-dependencies]
dev = ["pytest"]

[project.scripts]
boardview-mcp = "boardview_mcp.server:main"

[tool.setuptools]
packages = ["boardview_mcp"]
