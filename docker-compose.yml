services:

  ava:
    build:
      context: .
      dockerfile: Dockerfile
    image: ava:latest
    container_name: ava

    # Teto de RAM — rede de proteção em máquina fraca: o stack não pode
    # sufocar as outras apps. Valores folgados (OOM kill é pior que RAM alta);
    # com os defaults econômicos (TTS/grafo off) o uso real fica ~600-800MB.
    mem_limit: 1500m

    volumes:
      - ./mcp_servers:/app/mcp_servers
      - ./start.sh:/app/start.sh
      - ./Modules/Models:/app/Modules/Models
      - ./resource:/app/resource
      - ./Modules:/app/Modules
      - ./orchestrator.py:/app/orchestrator.py
      - ./scraping_client.py:/app/scraping_client.py
      - ava-cache:/root/.cache
      - ava-logs:/app/logs
      - ./graph_activation.py:/app/graph_activation.py
      # Agent Skills (SKILL.md — padrão skills.sh): o usuário instala/atualiza
      # com `npx skills add` NO HOST; o mount ro faz o container enxergar na
      # hora (o orchestrator re-sincroniza o índice semântico por assinatura).
      # PROJECT: .agents/skills do repo; GLOBAL: ~/.agents/skills do usuário
      # (npx skills add -g) montado em /root/.agents/skills — o default do
      # orchestrator (Path.home()) resolve igual nos dois lados. Skills de
      # projeto vence global em duplicata. Se ~/.agents/skills não existir no
      # host, o Docker cria o dir vazio (inofensivo — scan devolve nada).
      - ./.agents/skills:/app/.agents/skills:ro
      - ./skills-lock.json:/app/skills-lock.json:ro
      - ~/.agents/skills:/root/.agents/skills:ro
      # Skills CRIADAS PELO AGENTE em runtime (POST /skills/create → alpha-mcp
      # → orchestrator): dir SEPARADO do store do CLI (que segue ro — o CLI
      # `skills` nunca reconcilia o que está aqui). rw porque o orchestrator
      # escreve; bind mount = as skills aparecem no host também.
      - ./.agents/skills-created:/app/.agents/skills-created:rw

    # Tokens gerados pelo install.sh (AVA_INTERNAL_TOKEN, OPENROUTER_API_KEY,
    # CRAWL4AI_API_TOKEN...) + o provider de inferência (LLM_BASE_URL/
    # LLM_API_KEY/LLM_MODEL — qualquer API OpenAI-compatible; vão todos
    # juntos no env_file). Carregados DIRETO pelo compose — sem depender
    # do --env-file do docker-start.sh. O env_file injeta as variáveis NO
    # container (visíveis no `docker exec ava env`), ao contrário da
    # interpolação ${...}, que só roda no host antes do container existir.
    env_file:
      - Modules/.env

    environment:
      AVA_DEBUG: ""
      ONNX_PROVIDERS: "CPUExecutionProvider"
      PYTHONUNBUFFERED: "1"
      HF_HOME: "/root/.cache/huggingface"
      HF_HUB_TIMEOUT: "600"
      HF_HUB_DOWNLOAD_TIMEOUT: "600"
      HF_HUB_ETAG_TIMEOUT: "600"

    healthcheck:
      # curl NÃO existe na imagem (health ficava eternamente em "starting":
      # "exec: curl: executable file not found") — o probe roda com o python
      # que já está nela. /status responde 200 sem token. O container roda
      # com network_mode host (override linux), então 127.9.12.22 aqui É o
      # loopback do host — o orchestrator em 9000 é alcançável.
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.9.12.22:9000/status', timeout=5)"]
      interval: 30s
      timeout: 10s
      start_period: 240s
      retries: 5

    # Rotação dos logs do driver json-file (docker logs) — sem max-size o
    # json-file cresce sem controle. Logs de aplicação ficam no volume ava-logs.
    logging:
      driver: json-file
      options:
        max-size: "20m"
        max-file: "5"

  # ── Pipeline de busca web (alpha-mcp consome os três abaixo) ─────────────
  # Portas publicadas só em 127.9.12.22: o ava roda com network_mode: host no
  # override linux e alcança tudo via localhost; nada fica exposto na rede.

  searxng:
    image: searxng/searxng:latest
    container_name: ava-searxng
    mem_limit: 350m
    volumes:
      - ./resource/searxng/settings.yml:/etc/searxng/settings.yml:ro
    ports:
      - "127.9.12.22:8081:8080"
    environment:
      SEARXNG_BASE_URL: "http://127.9.12.22:8081/"

  valkey:
    image: valkey/valkey:8-alpine
    container_name: ava-valkey
    mem_limit: 96m
    ports:
      - "127.9.12.22:6379:6379"
    # Sem persistência (appendonly no + save "") — o cache vive só em RAM;
    # não há mais volume de cache do alpha-mcp montado (era sempre vazio no disco).
    command: ["valkey-server", "--appendonly", "no", "--save", ""]

  crawl4ai:
    image: unclecode/crawl4ai:latest
    container_name: ava-crawl4ai
    mem_limit: 1200m
    shm_size: 1g
    ports:
      - "127.9.12.22:11235:11235"
    environment:
      # Token interno — sem ele o servidor só escuta no loopback do container.
      # Gerado pelo install.sh em Modules/.env (falha de boot se ausente).
      CRAWL4AI_API_TOKEN: "${CRAWL4AI_API_TOKEN:?Defina CRAWL4AI_API_TOKEN no Modules/.env — install.sh gera}"

  alpha-mcp:
    build:
      context: ./mcp_servers/alpha-mcp
      dockerfile: Dockerfile
    image: ava-alpha-mcp:latest
    container_name: ava-alpha-mcp
    mem_limit: 400m
    volumes:
      - ./resource:/app/resource:ro
      # crawl4ai on-demand via docker-socket-proxy (abaixo): o socket do host
      # NÃO é mais montado aqui — o alpha-mcp só pode subir/parar o crawl4ai
      # através da allowlist do proxy (sem exec/images/volumes/networks).
      # DOCKER_HOST é lido automaticamente pelo docker.from_env().
    ports:
      - "127.9.12.22:4010:4010"
    environment:
      # Bind do uvicorn DENTRO do container: precisa ser 0.0.0.0. O default
      # do server.py é 127.9.12.22 (correto p/ execução nativa no host, mas
      # errado na bridge: a porta publicada 127.9.12.22:4010 encaminha pelo
      # IP do container, onde o loopback interno não escuta — o docker-proxy
      # aceita a conexão e fecha na sequência, e o cliente vê
      # "Connection reset by peer" → alpha-mcp UNHEALTHY em loop, como
      # visto no mcp_manager.log da instalação de 26/10. O playwright nunca
      # sofre disso porque é stdio). A publicação continua restrita ao
      # loopback do HOST (127.9.12.22:4010) — nada fica exposto na rede.
      ALPHA_MCP_HOST: "0.0.0.0"
      ALPHA_MCP_CONFIG: "/app/resource/alpha-mcp/config.json"
      SEARXNG_URL: "http://searxng:8080"
      CRAWL4AI_URL: "http://crawl4ai:11235"
      VALKEY_URL: "redis://valkey:6379/0"
      # memory_write_batch: a tool de gravação de memórias fala com a
      # memory_api direto (mesmo contrato REST do LLM.py /write/batch)
      MEMORY_API_URL: "http://ava:3000"
      # project_create/project_list e skill_create/skill_list falam com o
      # orchestrator (:9000) — criação de projetos e de skills pelo agente
      ORCHESTRATOR_URL: "http://ava:9000"
      # Auth interna: o orchestrator exige Bearer (mesmo token da memory).
      # Sem ele as rotas /projects e /skills/create devolvem 401.
      AVA_INTERNAL_TOKEN: "${AVA_INTERNAL_TOKEN:?Defina AVA_INTERNAL_TOKEN no Modules/.env — install.sh/install.ps1 geram}"
      CRAWL4AI_API_TOKEN: "${CRAWL4AI_API_TOKEN:?Defina CRAWL4AI_API_TOKEN no Modules/.env — install.sh gera}"
      DOCKER_HOST: "tcp://docker-socket-proxy:2375"

    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  # ── Proxy do socket Docker — o alpha-mcp não tem acesso direto ao socket ──
  # Allowlist mínima: apenas listar/inspecionar containers e start/stop do
  # crawl4ai (on-demand, economia de ~490MB RAM). Tudo mais (exec, images,
  # volumes, networks, build) fica bloqueado pelo HAProxy interno do proxy.
  # Sem portas publicadas: só alcançável pela rede interna do compose.
  docker-socket-proxy:
    image: tecnativa/docker-socket-proxy:latest
    container_name: ava-docker-socket-proxy
    mem_limit: 64m
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
    environment:
      CONTAINERS: 1
      ALLOW_START: 1
      ALLOW_STOP: 1
      POST: 1
      VERSION: 1
    restart: unless-stopped

volumes:
  ava-cache:
    driver: local
  ava-logs:
    driver: local
  # volume de cache do alpha-mcp removido — o valkey roda sem persistência
  # (--appendonly no, --save ""), o volume nunca recebia dado algum.
