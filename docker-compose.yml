services:

  ava:
    build:
      context: .
      dockerfile: Dockerfile
    image: ava:latest
    container_name: ava
    restart: unless-stopped

    volumes:
      - ./mcp_servers:/app/mcp_servers
      - ./ctxBin:/app/ctxBin
      - ./start.sh:/app/start.sh
      - ./Modules/Models:/app/Modules/Models:ro
      - ./Ctxbin:/app/Ctxbin:ro
      - ./resource:/app/resource
      - ./Modules:/app/Modules
      - ./orchestrator.py:/app/orchestrator.py
      - ./scraping_client.py:/app/scraping_client.py
      - ava-cache:/root/.cache
      - ava-logs:/app/logs

    environment:
      AVA_DEBUG: ""
      AVA_N_GPU_LAYERS: "99"
      ONNX_PROVIDERS: "CPUExecutionProvider"
      PYTHONUNBUFFERED: "1"
      HF_HOME: "/root/.cache/huggingface"
      HF_HUB_TIMEOUT: "600"
      HF_HUB_DOWNLOAD_TIMEOUT: "600"
      HF_HUB_ETAG_TIMEOUT: "600"

    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/status"]
      interval: 30s
      timeout: 10s
      start_period: 240s
      retries: 5

volumes:
  ava-cache:
    driver: local
  ava-logs:
    driver: local
