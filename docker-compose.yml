services:

  ava:
    build:
      context: .
      dockerfile: Dockerfile
    image: ava:latest
    container_name: ava

    volumes:
      - ./mcp_servers:/app/mcp_servers
      - ./start.sh:/app/start.sh
      - ./Modules/Models:/app/Modules/Models:ro
      - ./resource:/app/resource
      - ./Modules:/app/Modules
      - ./orchestrator.py:/app/orchestrator.py
      - ./scraping_client.py:/app/scraping_client.py
      - ava-cache:/root/.cache
      - ava-logs:/app/logs
      - ./graph_activation.py:/app/graph_activation.py

    environment:
      AVA_DEBUG: ""
      ONNX_PROVIDERS: "CPUExecutionProvider"
      PYTHONUNBUFFERED: "1"
      HF_HOME: "/root/.cache/huggingface"
      HF_HUB_TIMEOUT: "600"
      HF_HUB_DOWNLOAD_TIMEOUT: "600"
      HF_HUB_ETAG_TIMEOUT: "600"

    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/status"]
      interval: 30s
      timeout: 10s
      start_period: 240s
      retries: 5

  # ── Pipeline de busca web (websearch-mcp consome os três abaixo) ──────────
  # Portas publicadas só em 127.0.0.1: o ava roda com network_mode: host no
  # override linux e alcança tudo via localhost; nada fica exposto na rede.

  searxng:
    image: searxng/searxng:latest
    container_name: ava-searxng
    volumes:
      - ./resource/searxng/settings.yml:/etc/searxng/settings.yml:ro
    ports:
      - "127.0.0.1:8081:8080"
    environment:
      SEARXNG_BASE_URL: "http://127.0.0.1:8081/"

  valkey:
    image: valkey/valkey:8-alpine
    container_name: ava-valkey
    ports:
      - "127.0.0.1:6379:6379"
    volumes:
      - websearch-cache:/data
    command: ["valkey-server", "--appendonly", "no", "--save", ""]

  crawl4ai:
    image: unclecode/crawl4ai:latest
    container_name: ava-crawl4ai
    shm_size: 1g
    ports:
      - "127.0.0.1:11235:11235"
    environment:
      # Token interno — sem ele o servidor só escuta no loopback do container.
      # Gerado pelo install.sh em Modules/.env (falha de boot se ausente).
      CRAWL4AI_API_TOKEN: "${CRAWL4AI_API_TOKEN:?Defina CRAWL4AI_API_TOKEN no Modules/.env — install.sh gera}"

  websearch-mcp:
    build:
      context: ./mcp_servers/websearch
      dockerfile: Dockerfile
    image: ava-websearch-mcp:latest
    container_name: ava-websearch-mcp
    volumes:
      - ./resource:/app/resource:ro
      # crawl4ai on-demand via docker-socket-proxy (abaixo): o socket do host
      # NÃO é mais montado aqui — o websearch só pode subir/parar o crawl4ai
      # através da allowlist do proxy (sem exec/images/volumes/networks).
      # DOCKER_HOST é lido automaticamente pelo docker.from_env().
    ports:
      - "127.0.0.1:4010:4010"
    environment:
      WEBSEARCH_CONFIG: "/app/resource/websearch/config.json"
      SEARXNG_URL: "http://searxng:8080"
      CRAWL4AI_URL: "http://crawl4ai:11235"
      VALKEY_URL: "redis://valkey:6379/0"
      # memory_write_batch: a tool de gravação de memórias fala com a
      # memory_api direto (mesmo contrato REST do LLM.py /write/batch)
      MEMORY_API_URL: "http://ava:3000"
      CRAWL4AI_API_TOKEN: "${CRAWL4AI_API_TOKEN:?Defina CRAWL4AI_API_TOKEN no Modules/.env — install.sh gera}"
      DOCKER_HOST: "tcp://docker-socket-proxy:2375"

  # ── Proxy do socket Docker — o websearch não tem acesso direto ao socket ──
  # Allowlist mínima: apenas listar/inspecionar containers e start/stop do
  # crawl4ai (on-demand, economia de ~490MB RAM). Tudo mais (exec, images,
  # volumes, networks, build) fica bloqueado pelo HAProxy interno do proxy.
  # Sem portas publicadas: só alcançável pela rede interna do compose.
  docker-socket-proxy:
    image: tecnativa/docker-socket-proxy:latest
    container_name: ava-docker-socket-proxy
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
    environment:
      CONTAINERS: 1
      ALLOW_START: 1
      ALLOW_STOP: 1
      POST: 1
      VERSION: 1
    restart: unless-stopped

volumes:
  ava-cache:
    driver: local
  ava-logs:
    driver: local
  websearch-cache:
    driver: local
