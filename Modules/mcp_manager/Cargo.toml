[package]
name = "mcp_manager"
version = "1.0.0"
edition = "2021"
description = "AVA MCP Manager — registro REST + executor de servidores MCP (port Rust do mcp_manager.py)"

[dependencies]
axum = "0.8"
tokio = { version = "1", features = ["full"] }
rusqlite = { version = "0.32", features = ["bundled"] }
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["preserve_order"] }
indexmap = { version = "2", features = ["serde"] }
regex = "1"
tracing = "0.1"
tracing-subscriber = "0.3"
which = "6"
process-wrap = { version = "8.2", features = ["tokio1"] }
rmcp = { version = "0.8", features = ["client", "transport-child-process", "transport-streamable-http-client-reqwest"] }

[profile.release]
opt-level = 3
lto = "thin"
